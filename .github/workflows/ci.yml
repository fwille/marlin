name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test -- --coverage

      # Runs last on purpose: a supply-chain advisory says nothing about whether
      # our own code is correct, and when it ran first a single unfixable upstream
      # advisory skipped every check above it. Gated by scripts/audit-check.mjs
      # rather than `npm audit` directly so individual unpatched advisories can be
      # allowlisted with a justification instead of disabling the whole gate.
      - run: npm run audit
