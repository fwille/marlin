SourceCode: https://github.com/fwille/marlin
IssueTracker: https://github.com/fwille/marlin/issues

AutoName: Marlin
Description: |-
  Marlin is a marine species identification and life-list app for fish and
  marine life. Spot something while diving or snorkeling, look it up against
  iNaturalist's observation data, and log it to your personal life list with a
  photo, notes, and a pinned location. No account, no tracking, no ads —
  everything stays on your device, with manual export/import for backup.

RepoType: git
Repo: https://github.com/fwille/marlin.git

Builds:
  - versionName: 1.0.1
    versionCode: 2
    commit: 4ff5e137a93bdf80aa942d312c745ba1fceae19c
    sudo:
      - apt-get update
      - apt-get install -y curl xz-utils
      - curl -Lo /tmp/node.tar.xz https://nodejs.org/dist/v22.22.3/node-v22.22.3-linux-x64.tar.xz
      - echo "2e5d13569282d016861fae7c8f935e741693c269101a5bebcf761a5376d1f99f  /tmp/node.tar.xz"
        | sha256sum -c -
      - tar xJf /tmp/node.tar.xz --strip-components=1 -C /usr/local
      - rm /tmp/node.tar.xz
    init: npm ci
    output: android/app/build/outputs/apk/release/app-release-unsigned.apk
    prebuild:
      - sdkmanager 'cmake;3.22.1'
      - sed -i -e '/"android":\ {/a "buildFromSource":[".*"],' package.json
      - npx expo prebuild --platform android
      - printf 'org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m\norg.gradle.workers.max=2\n'
        >> android/gradle.properties
      - sed -i -e '/signingConfig /d' android/app/build.gradle
      - sed -i '/jvmToolchain/s/17/21/' node_modules/@react-native/gradle-plugin/*/build.gradle.kts
      - sed -i -e 's/JavaVersion.VERSION_17/JavaVersion.VERSION_21/g' -e 's/jvmToolchain(17)/jvmToolchain(21)/g'
        node_modules/@react-native/gradle-plugin/react-native-gradle-plugin/src/main/kotlin/com/facebook/react/utils/JdkConfiguratorUtils.kt
    scanignore:
      - node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
      - node_modules/@react-native-masked-view/masked-view/android/build.gradle
      - node_modules/expo-dev-launcher/android/build.gradle
      - node_modules/expo-dev-menu/android/build.gradle
      - node_modules/expo-location/android/build.gradle
      - node_modules/react-native-safe-area-context/android/build.gradle
      - node_modules/react-native-screens/android/build.gradle
      - node_modules/react-native-webview/android/build.gradle
    scandelete:
      - node_modules
    build: gradle -p android :app:assembleRelease
    ndk: 27.1.12297006

AutoUpdateMode: None
UpdateCheckMode: None
CurrentVersion: 1.0.1
CurrentVersionCode: 2
