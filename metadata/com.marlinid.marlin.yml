Builds:
  - versionName: 1.1.4
    versionCode: 71
    commit: 0dcbfecca0fb5c18050415c1d5666156c0b74847
    sudo:
      - echo "deb https://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y -t forky nodejs npm
    init: npm ci --omit=dev
    output: android/app/build/outputs/apk/release/app-release-unsigned.apk
    prebuild:
      - sdkmanager 'cmake;3.22.1'
      - sed -i -e '/"android":\ {/a "buildFromSource":[".*"],' package.json
      - npx expo prebuild --clean --no-install --platform android
      - echo 'org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1024m' >> android/gradle.properties
      - echo 'org.gradle.workers.max=2' >> android/gradle.properties
      - echo 'expo.inlineModules.watchedDirectories=[]' >> android/gradle.properties
      - echo 'android.enableMinifyInReleaseBuilds=true' >> android/gradle.properties
      - echo 'android.enableShrinkResourcesInReleaseBuilds=true' >> android/gradle.properties
      - sed -i -e '/signingConfig /d' android/app/build.gradle
      - echo 'android { dependenciesInfo { includeInApk = false; includeInBundle =
        false } }' >> android/app/build.gradle
      - echo 'android { lint { checkReleaseBuilds false } }' >> android/app/build.gradle
      - sed -i -E 's/versionCode [0-9]+/versionCode 71/' android/app/build.gradle
      - echo 'reactNativeArchitectures=armeabi-v7a' >> android/gradle.properties
      - sed -i '/jvmToolchain/s/17/21/' node_modules/@react-native/gradle-plugin/*/build.gradle.kts
      - sed -i -e 's/JavaVersion.VERSION_17/JavaVersion.VERSION_21/g' -e 's/jvmToolchain(17)/jvmToolchain(21)/g'
        node_modules/@react-native/gradle-plugin/react-native-gradle-plugin/src/main/kotlin/com/facebook/react/utils/JdkConfiguratorUtils.kt
    scanignore:
      - node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - node_modules/@react-native-masked-view/masked-view/android/build.gradle
      - node_modules/react-native-safe-area-context/android/build.gradle
      - node_modules/react-native-screens/android/build.gradle
      - node_modules/react-native-webview/android/build.gradle
    scandelete:
      - node_modules
    build: gradle -p android :app:assembleRelease
    ndk: 27.1.12297006

