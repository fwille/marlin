// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"

// Propagate the NDK version resolved by ExpoRootProjectPlugin to all library
// subprojects. Without this, modules with C++ code but no explicit ndkVersion
// (e.g. expo-sqlite) pick up the server's default side-by-side NDK, which can
// differ from ndk.dir and trigger CXX1104.
subprojects {
  plugins.withId("com.android.library") {
    android {
      ndkVersion rootProject.ext.ndkVersion
    }
  }
}
